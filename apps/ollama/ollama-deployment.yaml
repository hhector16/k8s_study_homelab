apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      containers:

      - name: ollama

        image: ollama/ollama:latest

        ports:
        - containerPort: 11434

        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama

        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"

          limits:
            cpu: "2"
            memory: "3Gi"

      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data